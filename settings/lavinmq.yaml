# LavinMQ Adapter Configuration
# Supports both AMQP and MQTT protocols
#
# Configuration Loading (Oneiric layered config):
#     1. Defaults in LavinMQSettings fields
#     2. settings/lavinmq.yaml (committed)
#     3. settings/local.yaml (gitignored)
#     4. Environment variables LAVINMQ_*
#
# LOCAL BROKER NOTE
#
# Exactly one supervisor may run the broker. A second instance cannot
# bind 5672/1883/15672/15692 and will crash-loop against the first.
#
# On the operator's Mac the broker runs under the hand-rolled LaunchAgent
# `com.bodai.lavinmq` (loopback-only, data dir ~/Library/lavinmq), NOT under
# `brew services` — `brew services list` reports `lavinmq none` because it
# has never been started by Homebrew. Starting it via Homebrew as well
# gives two instances on the same ports.
#
# Note also that Homebrew's own config (/usr/local/etc/lavinmq/lavinmq.ini)
# binds every listener to `::` — all interfaces — with the default
# guest/guest credentials. It must be hardened to 127.0.0.1 before
# `brew services start lavinmq` is used.
#
# See docs/plans/2026-11-08-lavinmq-provider-pinning.md.

# === Connection Settings ===

# AMQP connection URL
# Default: guest:guest@localhost:5672 (LavinMQ default)
amqp_url: "amqp://guest:guest@localhost:5672/"

# MQTT broker settings
mqtt_host: "localhost"
mqtt_port: 1883
mqtt_username: null
mqtt_password: null

# === Protocol Selection ===

# Preferred protocol: "amqp" or "mqtt"
# Set enable_both_protocols: true to use both simultaneously
preferred_protocol: "amqp"
enable_both_protocols: false

# === AMQP Queue Settings ===

queue: "oneiric-queue"
exchange: ""
routing_key: null
prefetch_count: 10
durable: true
passive: false
consume_timeout: 1.0

# === MQTT Settings ===

mqtt_topic: "oneiric/messages"
mqtt_qos: 1
mqtt_retain: false
mqtt_client_id: null

# === Connection Settings ===

reconnect_interval: 5.0
heartbeat: 60.0
ssl: false
ssl_options: null
credentials_secret: null

# === Metrics ===

# Prometheus metrics are exposed at localhost:15692 by LavinMQ
metrics_port: 15692
